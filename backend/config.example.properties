# ============================================================
# Example settings for the backend.
#
# Copy this file, name the copy config.properties, and fill in
# your own values. config.properties is ignored by Git, so your
# real password never ends up on GitHub.
# ============================================================

# Port the backend listens on. The app connects to this.
server.port=7070

# MySQL connection. These match backend/database/01_setup.sql.
# Use the password you set for momentum_app when you ran 01_setup.sql.
db.url=jdbc:mysql://localhost:3306/momentum
db.user=momentum_app
db.password=CHANGE_ME

# Secret used to sign login tokens (JWT). Keep it private.
# Any long random text works, for example 40 or more random letters and numbers.
jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_STRING

# LearnTech API (from the client). The app never sees these, only the backend.
# Ask Eben for the API key. Set base_url to "sample" to use the sample
# data in backend/sample-data instead of the real API.
learntech.base_url=https://eduvos.learntech.co.za/api/app/v1
learntech.api_key=CHANGE_ME

# Email, for two-step login codes and password reset codes. Optional: without
# it, those features say email isn't set up. For Gmail, use an "app password"
# (Google Account, Security, 2-Step Verification, App passwords), not your
# normal password.
mail.host=smtp.gmail.com
mail.port=587
mail.username=CHANGE_ME@gmail.com
mail.password=CHANGE_ME
mail.from=CHANGE_ME@gmail.com

# Optional. Where mysqldump is, for the daily database backup. Only needed if the
# backend can't find it in C:/Program Files/MySQL/MySQL Server .../bin by itself.
# backup.mysqldump=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe
