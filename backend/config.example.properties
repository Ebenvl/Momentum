# ============================================================
# Example settings for the backend.
#
# Copy this file, name the copy config.properties, and fill in
# your own values. config.properties is ignored by Git, so your
# real password never ends up on GitHub.
# ============================================================

# Port the backend listens on. The app connects to this.
server.port=7070

# MySQL connection. These match backend/database/01_setup.sql.
db.url=jdbc:mysql://localhost:3306/momentum
db.user=momentum_app
db.password=CHANGE_ME
